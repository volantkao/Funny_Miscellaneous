<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星艦六邊形網格編輯器 (HexGridEditor)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-color: #f8fafc;
      --border-color: #334155;
      --hex-black: #000000;
      --hex-gray: #64748b;
      --hex-white: #ffffff;
      --hex-stroke: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.8rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .toolbar {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: center;
      max-width: 900px;
      width: 100%;
      margin-bottom: 20px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    select, button, input[type="color"] {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #475569;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    select:hover, button:hover:not(:disabled) {
      border-color: #94a3b8;
      background: #334155;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .palette {
      display: flex;
      gap: 6px;
      align-items: center;
      background: #0f172a;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid #475569;
    }

    .color-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s, border-color 0.1s;
    }

    .color-btn:hover {
      transform: scale(1.1);
    }

    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    .color-btn.eraser {
      background: #e2e8f0;
      position: relative;
      overflow: hidden;
    }
    
    .color-btn.eraser::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: #ef4444;
      transform: translateY(-50%) rotate(-45deg);
    }

    input[type="color"] {
      width: 32px;
      height: 32px;
      padding: 2px;
      border-radius: 50%;
    }

    .canvas-container {
      background: #020617;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    svg {
      user-select: none;
    }

    polygon {
      stroke: var(--hex-stroke);
      stroke-width: 1.5;
      transition: fill 0.15s, stroke-width 0.1s;
    }

    /* White cells (Modifiable) */
    .hex-white {
      fill: var(--hex-white);
      cursor: pointer;
    }
    .hex-white:hover {
      stroke: #3b82f6;
      stroke-width: 3;
    }

    /* Black cells (Boundary) */
    .hex-black {
      fill: var(--hex-black);
      stroke: #333;
      cursor: not-allowed;
    }

    /* Gray cells (Fixed inside) */
    .hex-gray {
      fill: var(--hex-gray);
      stroke: #475569;
      cursor: not-allowed;
    }

    .legend {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .legend-box {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      border: 1px solid #94a3b8;
    }
  </style>
</head>
<body>

  <h1>星艦配置圖六邊形陣列編輯器</h1>

  <div class="toolbar">
    <div class="control-group">
      <label for="shipSelect">佈局 (Layout)：</label>
      <select id="shipSelect">
        <option value="fortress">堡壘級 (Fortress)</option>
        <option value="xuanyuan">軒轅級 (Xuanyuan)</option>
        <option value="tianxuan">天玄級 (Tianxuan)</option>
      </select>
    </div>

    <div class="control-group">
      <label>筆刷 (Brush)：</label>
      <div class="palette" id="colorPalette">
        <!-- Preset Colors -->
        <button class="color-btn active" style="background-color: #FF0000;" data-color="#FF0000" title="Red"></button>
        <button class="color-btn" style="background-color: #FFA500;" data-color="#FFA500" title="Orange"></button>
        <button class="color-btn" style="background-color: #FFFF00;" data-color="#FFFF00" title="Yellow"></button>
        <button class="color-btn" style="background-color: #008000;" data-color="#008000" title="Green"></button>
        <button class="color-btn" style="background-color: #0000FF;" data-color="#0000FF" title="Blue"></button>
        <button class="color-btn" style="background-color: #4B0082;" data-color="#4B0082" title="Indigo"></button>
        <button class="color-btn" style="background-color: #800080;" data-color="#800080" title="Purple"></button>
        <!-- Eraser -->
        <button class="color-btn eraser" data-color="eraser" title="Eraser (Clear to White)"></button>
      </div>
      <input type="color" id="customColor" value="#FF0000" title="Custom Color">
    </div>

    <div class="control-group">
      <button id="undoBtn" disabled title="Undo last action">↩ Undo</button>
      <button id="clearBtn" title="Clear all painted cells">🗑️ Clear All</button>
    </div>
  </div>

  <div class="canvas-container">
    <svg id="hexSvg" width="800" height="500" viewBox="-400 -250 800 500"></svg>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-box" style="background: #000;"></div> 外框 (Black Boundary)</div>
    <div class="legend-item"><div class="legend-box" style="background: #64748b;"></div> 障礙 (Gray Fixed)</div>
    <div class="legend-item"><div class="legend-box" style="background: #fff;"></div> 可變動 (White Editable)</div>
  </div>

  <script>
    const R = 22; // Hexagon radius
    const W = Math.sqrt(3) * R;
    const H = 2 * R;

    // Full blank hexagonal grid: every cell is editable.
    function generateBlankLayout() {
      const cells = [];
      // Large enough to fill the entire 800x500 editing area.
      // Coordinates are axial; every generated cell starts as white/editable.
      for (let q = -12; q <= 12; q++) {
        for (let r = -9; r <= 9; r++) {
          const { x, y } = hexToPixel(q, r);
          // Keep cells whose centers are close enough to the visible canvas.
          if (x >= -420 && x <= 420 && y >= -270 && y <= 270) {
            cells.push({ q, r, type: 'white' });
          }
        }
      }
      return cells;
    }

    const layouts = {
      fortress: generateBlankLayout(),
      xuanyuan: generateBlankLayout(),
      tianxuan: generateBlankLayout()
    };

    let currentShip = 'fortress';
    let currentColor = '#FF0000'; // Default is Red
    let coloredCells = {}; // { "q,r": "#color" }
    let undoStack = [];

    const svg = document.getElementById('hexSvg');
    const undoBtn = document.getElementById('undoBtn');
    
    function saveState() {
      // Push a deep copy of current painted cells
      undoStack.push(JSON.parse(JSON.stringify(coloredCells)));
      undoBtn.disabled = false;
    }

    function hexToPixel(q, r) {
      const x = W * (q + r / 2);
      const y = (H * 3 / 4) * r;
      return { x, y };
    }

    function getHexPoints(cx, cy, r) {
      const points = [];
      for (let i = 0; i < 6; i++) {
        const angle_deg = 60 * i - 30; // Pointy topped
        const angle_rad = Math.PI / 180 * angle_deg;
        points.push(`${cx + r * Math.cos(angle_rad)},${cy + r * Math.sin(angle_rad)}`);
      }
      return points.join(' ');
    }

    function renderGrid() {
      svg.innerHTML = ''; // Clear SVG
      const grid = layouts[currentShip];

      grid.forEach(cell => {
        const key = `${cell.q},${cell.r}`;
        const { x, y } = hexToPixel(cell.q, cell.r);
        
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', getHexPoints(x, y, R - 1));
        
        // Apply classes based on cell type
        if (cell.type === 'black') {
          poly.setAttribute('class', 'hex-black');
        } else if (cell.type === 'gray') {
          poly.setAttribute('class', 'hex-gray');
        } else if (cell.type === 'white') {
          poly.setAttribute('class', 'hex-white');
          
          // Apply color if it was painted
          if (coloredCells[key]) {
            poly.style.fill = coloredCells[key];
          } else {
            poly.style.fill = ''; // Reset to CSS default
          }

          // Interactivity for editable cells
          poly.addEventListener('click', () => {
            saveState();
            if (currentColor === 'eraser') {
              delete coloredCells[key];
            } else {
              coloredCells[key] = currentColor;
            }
            renderGrid();
          });
        }
        svg.appendChild(poly);
      });
    }

    // Layout selection
    document.getElementById('shipSelect').addEventListener('change', (e) => {
      currentShip = e.target.value;
      coloredCells = {}; // Clear colors on layout change
      undoStack = [];    // Clear history
      undoBtn.disabled = true;
      renderGrid();
    });

    // Color palette selection
    const colorBtns = document.querySelectorAll('.color-btn');
    const customColorInput = document.getElementById('customColor');

    function setActiveBrush(btn, colorVal) {
      colorBtns.forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      currentColor = colorVal;
    }

    colorBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const color = btn.getAttribute('data-color');
        setActiveBrush(btn, color);
        if (color !== 'eraser') {
          customColorInput.value = color;
        }
      });
    });

    customColorInput.addEventListener('input', (e) => {
      setActiveBrush(null, e.target.value); // Custom color active, untoggle presets
    });

    // Undo action
    undoBtn.addEventListener('click', () => {
      if (undoStack.length > 0) {
        coloredCells = undoStack.pop();
        if (undoStack.length === 0) undoBtn.disabled = true;
        renderGrid();
      }
    });

    // Clear All action
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (Object.keys(coloredCells).length > 0) {
        saveState();
        coloredCells = {};
        renderGrid();
      }
    });

    // Initial render
    renderGrid();
  </script>
</body>
</html>
